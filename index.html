<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Nome da Empresa | Cerimonial e Eventos</title>

  <link
    rel="icon"
    type="image/png"
    href="assets/img/icone.png"
  >

  <link
    rel="apple-touch-icon"
    href="assets/img/icone.png"
  >

  <link
    href="assets/css/bootstrap.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="assets/css/style.css"
  >
</head>

<body>

  <main class="exhibition-screen position-relative overflow-hidden">

    <!-- Área principal controlada pelo JavaScript -->
    <section
      id="mediaStage"
      class="media-stage"
      aria-label="Apresentação de serviços e eventos"
    >
    </section>


    <!-- Cabeçalho -->
    <header
      class="top-overlay position-absolute top-0 start-0 w-100 p-4 p-lg-5"
    >
      <div class="container-fluid px-0">

        <div
          class="d-flex justify-content-between align-items-start gap-3"
        >

          <div>

            <h1 class="display-5 fw-bold mb-1">
              Nome da Empresa
            </h1>

            <p class="lead mb-0 opacity-75">
              Cerimonial • Eventos • Celebrações
            </p>

          </div>

        </div>

      </div>
    </header>


    <!-- Rodapé -->
    <footer
      class="bottom-bar position-absolute bottom-0 start-0 w-100"
    >

      <div class="container-fluid px-4 px-lg-5 py-3">

        <div class="row align-items-center g-3">


          <!-- Logo -->
          <div class="col-12 col-md-4">

            <div class="d-flex align-items-center gap-3">

              <img
                src="assets/img/icone.png"
                class="brand-logo"
                alt="Logomarca da empresa"
              >

              <div>

                <div class="fw-semibold">
                  Nome da Empresa
                </div>

                <small class="opacity-75">
                  Transformamos momentos em memórias inesquecíveis.
                </small>

              </div>

            </div>

          </div>


          <!-- Contatos -->
          <div class="col-12 col-md-5 text-md-center">

            <span class="me-3">
              @instagram
            </span>

            <span>
              <a
                href="https://wa.me/5561991939043"
                class="t-branco"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Abrir conversa no WhatsApp"
              >
              (61) 99193-9043
              </a>
            </span>

          </div>

          <!-- QR Code -->
          <div class="col-12 col-md-3">

            <div
              class="d-flex justify-content-md-end align-items-center gap-3"
            >

              <div class="text-md-end d-none d-lg-block">

                <small class="d-block opacity-75">
                  Planejando um evento?
                </small>

                <strong>
                  Solicite seu orçamento
                </strong>

              </div>

              <a
                href="https://wa.me/5561991939043"
                class="qr-code"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Abrir conversa no WhatsApp"
              >
                <div id="whatsappQrCode" aria-hidden="true"></div>
              </a>

            </div>

          </div>

        </div>

      </div>

    </footer>


    <!-- Barra de progresso -->
    <div
      class="progress position-absolute start-0 w-100 rounded-0 slide-progress"
      role="progressbar"
      aria-label="Progresso da apresentação"
    >

      <div
        id="mediaProgress"
        class="progress-bar"
        style="width: 0%"
      >
      </div>

    </div>

  </main>


  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/qrcode.js"></script>
  <script src="assets/js/app.js"></script>

</body>
</html>
