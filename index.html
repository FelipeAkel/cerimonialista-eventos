<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>RT Eventos | Cerimonial e Eventos</title>

  <meta name="theme-color" content="#111111">
  <meta name="application-name" content="Cerimonial e Eventos">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="manifest" href="manifest.webmanifest">

  <link
    rel="icon"
    type="image/png"
    href="assets/img/logo-icones.png"
  >

  <link
    rel="apple-touch-icon"
    href="assets/img/icons/icon-192.png"
  >

  <link
    href="assets/css/bootstrap.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="assets/css/style.css"
  >
</head>

<body>

  <main class="exhibition-screen position-relative overflow-hidden">

    <!-- Área principal controlada pelo JavaScript -->
    <section
      id="mediaStage"
      class="media-stage"
      aria-label="Apresentação de serviços e eventos"
    >
    </section>

    <div
      id="centeredQrLayer"
      class="media-overlay-qr"
      role="img"
      hidden
    ></div>


    <!-- Cabeçalho -->
    <header
      class="top-overlay position-absolute top-0 start-0 w-100 p-4 p-lg-5"
    >
      <div class="container-fluid px-0">

        <div
          class="d-flex justify-content-between align-items-start gap-3"
        >

        <!-- id="companyInfo" -->
          <div
            class="text-fade"
          >

            <h1 class="display-5 fw-bold mb-1">
              RT Eventos
            </h1>

            <p class="lead mb-0 opacity-75">
              Cerimonial • Eventos • Celebrações
            </p>

          </div>

        </div>

      </div>
    </header>

    <!-- Controle de áudio: aparece quando há interação com a tela -->
    <button
      id="soundToggle"
      class="sound-toggle"
      type="button"
      aria-label="Ativar som"
      aria-pressed="false"
      title="Ativar som"
    >
      <svg class="sound-icon sound-icon-muted" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M11 5 6 9H3v6h3l5 4V5Z" />
        <path d="m16 9 5 5m0-5-5 5" />
      </svg>
      <svg class="sound-icon sound-icon-on" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M11 5 6 9H3v6h3l5 4V5Z" />
        <path d="M15 9.5a4 4 0 0 1 0 5M17.5 7a7 7 0 0 1 0 10" />
      </svg>
    </button>


    <!-- Rodapé -->
    <footer
      id="appFooter"
      class="bottom-bar position-absolute bottom-0 start-0 w-100"
    >
      <div class="container-fluid px-4 px-lg-5 py-3">
        <div class="row align-items-center g-3">
          <div class="col-12 col-md-4 footer-info">
            <div class="d-flex align-items-center gap-3">
              <img
                id="footerLogo"
                src="assets/img/logomarca.png"
                class="brand-logo"
                alt="Logomarca da RT Eventos"
              >
              <div>
                <div id="footerName" class="fw-semibold">RT Eventos</div>
                <small id="footerTagline" class="opacity-75">
                  Transformamos momentos em memórias inesquecíveis.
                </small>
              </div>
            </div>
          </div>

          <div class="col-12 col-md-5 footer-info">
            <div class="footer-contacts justify-content-md-center">
              <a
                id="footerInstagram"
                href="https://www.instagram.com/rtev.entos/"
                class="footer-contact t-branco"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Abrir o Instagram da RT Eventos"
              >
                <img
                  src="assets/img/icons/instagram.png"
                  class="footer-contact-icon"
                  alt=""
                  aria-hidden="true"
                >
                <span>@rtev.entos</span>
              </a>
              <a
                id="footerWhatsapp"
                href="https://wa.me/5561991091587?text=Ol%C3%A1%2C%20RT%20Eventos%21%20Quero%20informa%C3%A7%C3%B5es."
                class="footer-contact t-branco"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Abrir conversa com a RT Eventos no WhatsApp"
              >
                <img
                  src="assets/img/icons/whatsapp.png"
                  class="footer-contact-icon"
                  alt=""
                  aria-hidden="true"
                >
                <span id="footerWhatsappText">(61) 99109-1587</span>
              </a>
            </div>
          </div>

          <div class="col-12 col-md-3 qr-column">
            <div class="d-flex justify-content-end align-items-center gap-3">
              <div class="text-end d-none d-lg-block footer-info">
                <small id="footerCtaEyebrow" class="d-block opacity-75">Planejando um evento?</small>
                <strong id="footerCtaTitle">Solicite seu orçamento</strong>
                <small class="d-sm-block opacity-75">Escaneie para abrir o WhatsApp</small>
              </div>
              <a
                id="footerQrLink"
                href="https://wa.me/5561991091587?text=Ol%C3%A1%2C%20RT%20Eventos%21%20Quero%20informa%C3%A7%C3%B5es."
                class="qr-code"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Abrir conversa com a RT Eventos no WhatsApp"
              >
                <div id="whatsappQrCode" aria-hidden="true"></div>
              </a>
            </div>
          </div>
        </div>
      </div>
    </footer>


    <!-- Barra de progresso -->
    <div
      class="progress position-absolute start-0 w-100 rounded-0 slide-progress"
      role="progressbar"
      aria-label="Progresso da apresentação"
    >

      <div
        id="mediaProgress"
        class="progress-bar"
        style="width: 0%"
      >
      </div>

    </div>

  </main>


  <script src="assets/js/bootstrap.bundle.js"></script>
  <script src="assets/js/qrcode.js"></script>
  <script src="assets/js/app.js"></script>

</body>
</html>
